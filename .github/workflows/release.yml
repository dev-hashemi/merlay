# Release (Obsidian + VS Code, single lockstep version)
#
# One tag per release, bare version (e.g. 0.5.0), equal to the version in
# package.json, packages/obsidian/manifest.json, packages/vscode/package.json
# AND the manifest.json mirror at the repo root (which Obsidian reads to
# discover new versions). No `vscode-` prefixed tags exist.
#
# Order is deliberate: Open VSX publishes BEFORE the GitHub release is
# created, so a failed publish never leaves a half-shipped release.
# The full checklist lives in RELEASING.md.
name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify tag matches every manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          ROOT_PKG="$(node -p "require('./package.json').version")"
          OBS_PKG="$(node -p "require('./packages/obsidian/package.json').version")"
          OBS_MANIFEST="$(node -p "require('./packages/obsidian/manifest.json').version")"
          VSCODE_PKG="$(node -p "require('./packages/vscode/package.json').version")"
          ROOT_MANIFEST="$(node -p "require('./manifest.json').version")"
          for V in "$ROOT_PKG" "$OBS_PKG" "$OBS_MANIFEST" "$VSCODE_PKG" "$ROOT_MANIFEST"; do
            if [ "$TAG" != "$V" ]; then
              echo "Tag $TAG does not match a manifest version ($ROOT_PKG / $OBS_PKG / $OBS_MANIFEST / $VSCODE_PKG / $ROOT_MANIFEST)"
              exit 1
            fi
          done
          if ! node -e "process.exit(require('./packages/obsidian/versions.json')['$TAG'] ? 0 : 1)"; then
            echo "packages/obsidian/versions.json is missing an entry for $TAG"
            exit 1
          fi
          cmp manifest.json packages/obsidian/manifest.json
          cmp versions.json packages/obsidian/versions.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build both hosts
        run: npm run build

      - name: Package VS Code extension (.vsix)
        # --no-dependencies is required: without it vsce follows the
        # workspace symlink and bundles the whole monorepo (.env included).
        run: npx -y @vscode/vsce package --no-dependencies
        working-directory: packages/vscode

      - name: Publish to Open VSX
        run: npx -y ovsx publish *.vsix
        working-directory: packages/vscode

      - name: Create GitHub release (Obsidian assets + .vsix)
        uses: softprops/action-gh-release@v3
        with:
          name: Merlay ${{ github.ref_name }}
          body_path: .github/releases/${{ github.ref_name }}.md
          discussion_category_name: Announcements
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packages/obsidian/main.js
            packages/obsidian/manifest.json
            packages/obsidian/styles.css
            packages/vscode/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
