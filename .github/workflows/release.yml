# Release checklist (Obsidian community directory):
# 1. manifest.json `version` is x.y.z and EXACTLY equals the git tag (no `v` prefix).
# 2. versions.json has an entry for the new version; bump minAppVersion only if new APIs are used.
# 3. Tag only after `npm test` + `npm run build` pass — this workflow attaches
#    main.js + manifest.json + styles.css to the GitHub release automatically.
name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build:obsidian

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Merlay ${{ github.ref_name }}
          body_path: .github/releases/${{ github.ref_name }}.md
          discussion_category_name: Announcements
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packages/obsidian/main.js
            packages/obsidian/manifest.json
            packages/obsidian/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
